!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بطاقة المعلومات والباركود</title>
    <!-- استدعاء مكتبة QR Code -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .card {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 450px;
            padding: 25px;
            border-top: 5px solid #2b5876;
        }

        h2 {
            text-align: center;
            color: #2b5876;
            margin-bottom: 20px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }

        .label {
            font-weight: bold;
            color: #555;
        }

        .value {
            color: #222;
        }

        .qr-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 25px;
            padding-top: 15px;
            border-top: 2px dashed #ddd;
        }

        #qrcode {
            padding: 10px;
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        .qr-label {
            margin-top: 8px;
            font-size: 0.85em;
            color: #777;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>بطاقة المعلومات الشخصية</h2>

        <div class="info-row">
            <span class="label">الاسم الكامل (فرنسي):</span>
            <span class="value">HARCHAOUI DRISS</span>
        </div>

        <div class="info-row">
            <span class="label">الاسم الكامل (عربي):</span>
            <span class="value">هرشاوي مروان</span>
        </div>

        <div class="info-row">
            <span class="label">رقم الهوية:</span>
            <span class="value">S199465</span>
        </div>

        <div class="info-row">
            <span class="label">الجنس:</span>
            <span class="value">ذكر</span>
        </div>

        <div class="info-row">
            <span class="label">النشاط / المهنة:</span>
            <span class="value">إصلاح وتصميم المركبات</span>
        </div>

        <!-- قسم الـ QR Code -->
        <div class="qr-section">
            <div id="qrcode"></div>
            <span class="qr-label">امسح الرمز للتحقق من البيانات</span>
        </div>
    </div>

        // يمكنك وضع رابط موقعك أو نص يحوي البيانات
